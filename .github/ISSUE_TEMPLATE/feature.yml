name: Feature / task
description: A piece of work to build
labels: ["feat"]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [integrations, ai, commerce, payments, frontend, devops]
    validations:
      required: true
